name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate data, tests, and production build
        env:
          VITE_FEATURE_DIARY: '1'
          VITE_TRACT_CRIME_SNAPSHOT: '1'
        run: npm run validate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke
        env:
          VITE_FEATURE_DIARY: '1'
          VITE_TRACT_CRIME_SNAPSHOT: '1'
        run: npm run test:browser-smoke

      - name: Run visual experience checks
        env:
          VITE_FEATURE_DIARY: '1'
          VITE_TRACT_CRIME_SNAPSHOT: '1'
        run: npm run test:visual-experience

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
