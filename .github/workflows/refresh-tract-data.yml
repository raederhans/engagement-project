name: Refresh tract data

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tract-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check exact 7-day cadence
        id: cadence
        run: node scripts/check_data_refresh_due.mjs --anchor 2026-08-03 --interval 7

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.due == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.due == 'true'
        run: npm ci

      - name: Refresh and validate tract data
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.due == 'true'
        env:
          VITE_FEATURE_DIARY: '1'
          VITE_TRACT_CRIME_SNAPSHOT: '1'
        run: |
          set -euo pipefail
          npm run data:refresh:tract-crime
          npm run validate

      - name: Detect semantic data changes
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.due == 'true'
        id: changes
        shell: bash
        run: |
          tract_changed=false
          snapshot_changed=false
          if ! git diff --quiet -- public/data/tracts_phl.geojson; then
            tract_changed=true
          fi
          if ! git diff --quiet -- public/data/tract_crime_counts_last12m.json; then
            if ! node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';

          const artifact = 'public/data/tract_crime_counts_last12m.json';
          const previous = JSON.parse(execFileSync('git', ['show', `HEAD:${artifact}`], { encoding: 'utf8' }));
          const current = JSON.parse(readFileSync(artifact, 'utf8'));
          delete previous.meta.generated_at;
          delete current.meta.generated_at;

          function canonicalize(value) {
            if (Array.isArray(value)) return value.map(canonicalize);
            if (value && typeof value === 'object') {
              return Object.fromEntries(
                Object.keys(value).sort().map((key) => [key, canonicalize(value[key])]),
              );
            }
            return value;
          }

          if (JSON.stringify(canonicalize(previous)) !== JSON.stringify(canonicalize(current))) {
            process.exitCode = 1;
          }
          NODE
            then
              snapshot_changed=true
            fi
          fi
          if [[ "$tract_changed" == false && "$snapshot_changed" == false ]]; then
            git restore -- public/data/tracts_phl.geojson public/data/tract_crime_counts_last12m.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create review branch and pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="automation/tract-data-refresh-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- public/data/tracts_phl.geojson public/data/tract_crime_counts_last12m.json
          git commit -m "Refresh published tract data"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Refresh published tract data" \
            --body "Automated weekly refresh of the published Philadelphia tract boundary and crime snapshot. Generated files were rebuilt and the full validation suite passed. Review and merge manually; this workflow never pushes directly to main."
