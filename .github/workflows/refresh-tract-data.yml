name: Refresh tract data

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tract-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check exact 7-day cadence
        id: cadence
        run: node scripts/check_data_refresh_due.mjs --anchor 2026-08-03 --interval 7

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.due == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.due == 'true'
        run: npm ci

      - name: Refresh and validate tract data
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.due == 'true'
        env:
          VITE_FEATURE_DIARY: '1'
          VITE_TRACT_CRIME_SNAPSHOT: '1'
        run: |
          set -euo pipefail
          npm run data:refresh:tract-crime
          npm run validate

      - name: Detect semantic data changes
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.due == 'true'
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- \
            public/data/tracts_phl.geojson \
            public/data/tract_crime_counts_last12m.json \
            src/source_health/tract_crime_bundled_receipt.json \
            src/source_health/tract_crime_bundled_receipt.generated.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create review branch and pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="automation/tract-data-refresh-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- \
            public/data/tracts_phl.geojson \
            public/data/tract_crime_counts_last12m.json \
            src/source_health/tract_crime_bundled_receipt.json \
            src/source_health/tract_crime_bundled_receipt.generated.js
          git commit -m "Refresh published tract data"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Refresh published tract data" \
            --body "Automated weekly refresh of the published Philadelphia tract boundary plus the validated tract snapshot/Source Health receipt pair. Generated files were rebuilt and the full validation suite passed. Review and merge manually; this workflow never pushes directly to main."
