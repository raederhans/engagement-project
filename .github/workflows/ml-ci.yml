name: Python ML research CI

on:
  pull_request:
    paths:
      - "ml/**"
      - ".github/workflows/ml-ci.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/lib/area_intelligence_model.mjs"
      - "scripts/lib/ml_shadow_bridge/**"
      - "scripts/project_ml_shadow_forecast.mjs"
      - "scripts/tests/ml_m7_shadow_bridge.mjs"
      - "scripts/data/area_intelligence_evaluation_protocol.v2.json"
      - "scripts/data/area_intelligence_evaluation_protocol.v3.json"
  push:
    paths:
      - "ml/**"
      - ".github/workflows/ml-ci.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/lib/area_intelligence_model.mjs"
      - "scripts/lib/ml_shadow_bridge/**"
      - "scripts/project_ml_shadow_forecast.mjs"
      - "scripts/tests/ml_m7_shadow_bridge.mjs"
      - "scripts/data/area_intelligence_evaluation_protocol.v2.json"
      - "scripts/data/area_intelligence_evaluation_protocol.v3.json"
  workflow_dispatch:
    inputs:
      run_full:
        description: "Run exact-registry full benchmark on the dedicated self-hosted runner"
        required: true
        default: false
        type: boolean
      registry_path:
        description: "Absolute path to exact ArtifactRegistry/v1"
        required: true
        type: string
      registry_root:
        description: "Absolute registry file-location root"
        required: true
        type: string
      protocol_path:
        description: "Absolute frozen protocol-v2 path"
        required: true
        type: string
      device:
        description: "Controlled full-run device"
        required: true
        default: cpu
        type: choice
        options:
          - cpu
          - cuda

permissions:
  contents: read

jobs:
  node-bridge-gate:
    name: Governed Node shadow bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Validate M7 schemas and aggregate-only shadow bridge
        run: npm run test:ml-m7

  cpu-gates:
    name: CPU gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: "ml/uv.lock"
      - name: Install locked CPU environment
        run: uv sync --locked --extra cpu --group dev
      - name: Ruff
        run: uv run --locked --extra cpu ruff check .
      - name: Mypy
        run: uv run --locked --extra cpu mypy
      - name: Pytest, synthetic training, parity, and leakage gates
        run: uv run --locked --extra cpu pytest -m "not full"

  full-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.run_full
    runs-on: [self-hosted, linux, ml-benchmark]
    env:
      ML_UV_EXTRA: ${{ inputs.device == 'cuda' && 'cu130' || 'cpu' }}
      ML_REGISTRY_PATH: ${{ inputs.registry_path }}
      ML_REGISTRY_ROOT: ${{ inputs.registry_root }}
      ML_PROTOCOL_PATH: ${{ inputs.protocol_path }}
      ML_OUTPUT_ROOT: ${{ github.workspace }}/ml/.artifacts/m7-${{ github.run_id }}-${{ github.run_attempt }}
      ML_DEVICE: ${{ inputs.device }}
    defaults:
      run:
        working-directory: ml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.7"
      - name: Install exact locked accelerator environment
        shell: bash
        run: uv sync --locked --no-group dev --extra "$ML_UV_EXTRA"
      - name: Run registry-admitted full benchmark
        shell: bash
        run: >-
          uv run --locked --no-group dev --extra "$ML_UV_EXTRA" engagement-ml full-benchmark
          --repo-root "${GITHUB_WORKSPACE}"
          --registry "$ML_REGISTRY_PATH"
          --registry-root "$ML_REGISTRY_ROOT"
          --protocol "$ML_PROTOCOL_PATH"
          --output "$ML_OUTPUT_ROOT"
          --device "$ML_DEVICE"
      - name: Project governed aggregate shadow artifact
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [[ ! -f "$ML_OUTPUT_ROOT/model-admission-receipt.json" ]]; then
            exit 0
          fi
          bridge_args=(
            --admission "$ML_OUTPUT_ROOT/model-admission-receipt.json"
            --output "$ML_OUTPUT_ROOT/shadow-forecast-artifact.json"
          )
          [[ -f "$ML_OUTPUT_ROOT/model-benchmark-report.json" ]] && bridge_args+=(--benchmark "$ML_OUTPUT_ROOT/model-benchmark-report.json")
          [[ -f "$ML_OUTPUT_ROOT/calibration-report.json" ]] && bridge_args+=(--calibration "$ML_OUTPUT_ROOT/calibration-report.json")
          [[ -f "$ML_OUTPUT_ROOT/model-card.json" ]] && bridge_args+=(--model-card "$ML_OUTPUT_ROOT/model-card.json")
          node scripts/project_ml_shadow_forecast.mjs "${bridge_args[@]}"
      - name: Upload small aggregate receipts and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ml-research-receipts-${{ github.sha }}
          path: |
            ${{ env.ML_OUTPUT_ROOT }}/feature-parity-receipt.json
            ${{ env.ML_OUTPUT_ROOT }}/dataset/manifest.json
            ${{ env.ML_OUTPUT_ROOT }}/benchmark-report.json
            ${{ env.ML_OUTPUT_ROOT }}/research-run.json
            ${{ env.ML_OUTPUT_ROOT }}/full-benchmark-receipt.json
            ${{ env.ML_OUTPUT_ROOT }}/model-benchmark-report.json
            ${{ env.ML_OUTPUT_ROOT }}/calibration-report.json
            ${{ env.ML_OUTPUT_ROOT }}/model-card.json
            ${{ env.ML_OUTPUT_ROOT }}/model-admission-receipt.json
            ${{ env.ML_OUTPUT_ROOT }}/shadow-forecast-artifact.json
          if-no-files-found: warn
          retention-days: 7
