[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "engagement-ml"
version = "0.1.0"
description = "Research-only aggregate Area Intelligence benchmarks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.2",
  "pyarrow==25.0.1",
  "scikit-learn==1.9.0",
  "scipy==1.18.1",
]

[project.optional-dependencies]
cpu = ["torch==2.13.0"]
cu130 = ["torch==2.13.0"]

[project.scripts]
engagement-ml = "engagement_ml.cli:main"

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.5",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/engagement_ml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["full: requires an admitted full M2 artifact set"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
